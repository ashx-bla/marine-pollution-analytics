
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Marine Research</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #071b27;
            color: #e8f2ef;
            font-family: Arial, sans-serif;
        }
        .login-card {
            width: min(90%, 390px);
            padding: 32px;
            background: #102d3a;
            border: 1px solid #28505a;
            border-radius: 16px;
        }
        h1 { color: #a8d8c8; margin-bottom: 8px; }
        p { color: #b5c8ca; line-height: 1.5; }
        label { display: block; margin: 18px 0 8px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #52717a;
            background: #071b27;
            color: white;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #a8d8c8;
            color: #071b27;
            border: 0;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }
        .message { margin-top: 16px; }
        a { color: #a8d8c8; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Admin Login</h1>
        <p>Marine Pollution Monitoring &amp; Ecological Impact Analytics</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" maxlength="50" required autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" required autocomplete="current-password">

            <button type="submit">Sign In</button>
        </form>

        <p><a href="{{ url_for('home') }}">← Back to main dashboard</a></p>
    </main>
</body>
</html>
